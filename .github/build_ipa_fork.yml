name: Build IPA (fork)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build archive (unsigned)
        run: |
          xcodebuild clean archive \
            -project StikDebug.xcodeproj \
            -scheme "StikDebug" \
            -configuration Debug \
            -archivePath build/StikDebug.xcarchive \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_OPTIMIZATION_LEVEL="-Onone" \
            IPHONEOS_DEPLOYMENT_TARGET=17.4

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/StikDebug.xcarchive/Products/Applications/StikDebug.app Payload/
          zip -r StikDebug-fork.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: StikDebug-fork-ipa
          path: StikDebug-fork.ipa
          retention-days: 30
